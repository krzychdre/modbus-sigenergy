services:
  sigenergy-modbus-mqtt:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /etc/sigenergy-modbus-mqtt:/etc/sigenergy-modbus-mqtt:ro
      # Persist the daily energy accumulator across restarts (writable).
      # Must match energy_integration.state_file's directory in config.yaml.
      - ./vol/sigenergy-state:/var/lib/sigenergy-modbus-mqtt
